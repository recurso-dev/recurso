## WARNING: Do NOT commit real credentials to this file.
## Use `kubectl create secret` or a sealed-secrets / SOPS workflow instead.
## This template exists only to document the required keys.
apiVersion: v1
kind: Secret
metadata:
  name: recurso-secrets
  namespace: recurso
type: Opaque
stringData:
  DATABASE_URL: "REPLACE_ME"
  REDIS_URL: "REPLACE_ME"
  STRIPE_SECRET_KEY: "REPLACE_ME"
  STRIPE_WEBHOOK_SECRET: "REPLACE_ME"
  OPENAI_API_KEY: "REPLACE_ME"
  OPENEXCHANGERATES_APP_ID: "REPLACE_ME"
  OAUTH_STATE_SECRET: "REPLACE_ME"
  SMTP_HOST: "REPLACE_ME"
  SMTP_PORT: "REPLACE_ME"
  SMTP_USERNAME: "REPLACE_ME"
  SMTP_PASSWORD: "REPLACE_ME"
  SMTP_FROM: "REPLACE_ME"
  # Encrypts stored gateway/integration credentials (BYO keys, OAuth tokens).
  GATEWAY_ENCRYPTION_KEY: "REPLACE_ME"
  RAZORPAY_KEY_ID: "REPLACE_ME"
  RAZORPAY_KEY_SECRET: "REPLACE_ME"
  RAZORPAY_WEBHOOK_SECRET: "REPLACE_ME"
  GOCARDLESS_WEBHOOK_SECRET: "REPLACE_ME"
  # Bearer token gating the Prometheus scrape endpoint (open when unset).
  METRICS_TOKEN: "REPLACE_ME"
