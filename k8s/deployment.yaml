apiVersion: apps/v1
kind: Deployment
metadata:
  name: recurso-api
  namespace: recurso
  labels:
    app: recurso
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: recurso
      component: api
  template:
    metadata:
      labels:
        app: recurso
        component: api
    spec:
      serviceAccountName: recurso-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Pinned to a release tag: `latest` is pushed by BOTH the main build
          # and the tag build, so two replicas could pull different images.
          # Bump this on each release.
          image: ghcr.io/recurso-dev/recurso:v0.14.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Writable scratch space (Tally exports default to /tmp/tally-exports)
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: recurso-config
            - secretRef:
                name: recurso-secrets
          # Migrations run before the listener opens, so give the process a
          # generous startup window instead of a liveness kill mid-migration.
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 36
          # Liveness must be shallow: /health returns 503 while Postgres is
          # unreachable, and using it here restarted every pod at once on a
          # database blip. The process being able to accept a TCP connection is
          # the "alive" signal; /health stays the readiness gate.
          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
