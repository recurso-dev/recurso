name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the default GITHUB_TOKEN is read-only for every job; the
# build job widens to packages:write itself. A superseded push on the same
# ref cancels the older run instead of burning runners.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.26.8"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      # Version pinned: `latest` let a new golangci release turn CI red with
      # no code change. Policy (linters, exclusions) lives in .golangci.yml.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Unit tests
        working-directory: frontend
        run: npx vitest run

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: recurso_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Create scratch DB for postgres-backed tests
        run: PGPASSWORD=password psql -h localhost -U user -d recurso_test -c "CREATE DATABASE recurso_repo_test;" -c "CREATE DATABASE recurso_migr;"

      # Every .up.sql needs a .down.sql that actually reverses it: rollback on
      # this repo silently did not work past version 7 for months because one
      # down dropped a table another migration owned. Apply everything, roll
      # all the way back to zero, and apply again against a throwaway database.
      - name: Migrations round-trip (up, down -all, up)
        env:
          MIGRATE_DB: postgres://user:password@localhost:5432/recurso_migr?sslmode=disable
        run: |
          go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.1
          M="$(go env GOPATH)/bin/migrate -path internal/adapter/db/migrations -database $MIGRATE_DB"
          $M up
          $M down -all
          left=$(PGPASSWORD=password psql -h localhost -U user -d recurso_migr -tAc "select count(*) from pg_tables where schemaname='public' and tablename <> 'schema_migrations'")
          if [ "$left" != "0" ]; then echo "FATAL: $left tables remain after migrate down -all"; exit 1; fi
          $M up
          echo "OK: migrations round-trip"

      - name: Run tests
        env:
          DATABASE_URL: postgres://user:password@localhost:5432/recurso_test?sslmode=disable
          # Enables the postgres-backed repository/e2e tests (trial flow,
          # user/session, invoice items, recovered payments) — without this
          # they skip silently.
          TEST_DATABASE_URL: postgres://user:password@localhost:5432/recurso_repo_test?sslmode=disable
          # Enables the Redis-backed distributed-lock tests (scheduler mutual
          # exclusion / TTL) — without this they skip silently.
          TEST_REDIS_URL: redis://localhost:6379/0
          APP_ENV: test
        run: go test -v -race -coverprofile=coverage.out ./...

      # Guard against a silent false-green: the ledger invariant harness is the
      # money-path safety net, but it SKIPS when TEST_DATABASE_URL is unset. If
      # someone ever drops the postgres service or that env, `go test ./...`
      # above would still pass with the harness quietly skipped. This step runs
      # it explicitly and fails the build unless it actually PASSED — so the
      # accrual/ledger coverage can never be disabled without turning CI red.
      - name: Assert ledger invariant harness ran (not skipped)
        env:
          TEST_DATABASE_URL: postgres://user:password@localhost:5432/recurso_repo_test?sslmode=disable
          APP_ENV: test
        run: |
          out=$(go test -run '^TestLedgerInvariants_RandomizedBillingSequences$' -v ./internal/service/ 2>&1) || {
            echo "$out"; echo "FATAL: ledger invariant harness failed"; exit 1;
          }
          echo "$out"
          if echo "$out" | grep -q -- '--- SKIP.*TestLedgerInvariants_RandomizedBillingSequences'; then
            echo "FATAL: ledger invariant harness SKIPPED — Postgres not provisioned for tests"; exit 1
          fi
          echo "$out" | grep -q -- '--- PASS: TestLedgerInvariants_RandomizedBillingSequences' || {
            echo "FATAL: ledger invariant harness did not run to a PASS"; exit 1;
          }
          echo "OK: ledger invariant harness executed against Postgres"

      # Same anti-false-green guard for the OpenAPI drift gate: CLAUDE.md
      # calls it a hard gate, so assert the test itself ran to a PASS rather
      # than trusting it stayed inside `go test ./...`.
      - name: Assert OpenAPI drift gate ran (not skipped)
        run: |
          out=$(go test -run '^TestOpenAPISpecCoversRegisteredRoutes$' -v ./cmd/api/ 2>&1) || {
            echo "$out"; echo "FATAL: OpenAPI drift gate failed"; exit 1;
          }
          echo "$out" | grep -q -- '--- PASS: TestOpenAPISpecCoversRegisteredRoutes' || {
            echo "$out"; echo "FATAL: OpenAPI drift gate did not run to a PASS"; exit 1;
          }
          echo "OK: OpenAPI drift gate executed"

      # Coverage ratchet: the profile used to be uploaded and never read. The
      # floor lives in scripts/coverage_floor.txt; raise it when coverage
      # rises, never lower it without a note in the PR.
      - name: Enforce coverage floor
        run: scripts/coverage_gate.sh coverage.out scripts/coverage_floor.txt

      - name: Upload coverage
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage.out

  # Cross-repo drift: the SDKs and the docs site track cmd/api/openapi.yaml by
  # hand. This job checks out the sibling repos and fails when the docs copy
  # of the spec differs or an SDK's covered-path count drops below its
  # recorded baseline (scripts/sdk_drift_baseline.json). Raising coverage
  # updates the baseline via `scripts/sdk_drift.py --update-baseline`.
  sdk-drift:
    name: SDK & docs drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: recurso
      # A coordinated change ships as same-named branches across the repos.
      # Check each sibling out at this branch when it exists, else at its
      # default branch, so a PR is judged against the state it will merge with.
      - name: Check out sibling repos
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          for repo in recurso-go recurso-node recurso-python docs; do
            url="https://github.com/recurso-dev/${repo}.git"
            if git ls-remote --exit-code --heads "$url" "$BRANCH" >/dev/null 2>&1; then
              echo "${repo}: branch ${BRANCH}"
              git clone --quiet --depth 1 --branch "$BRANCH" "$url" "$repo"
            else
              echo "${repo}: default branch"
              git clone --quiet --depth 1 "$url" "$repo"
            fi
          done
      - name: Check drift
        working-directory: recurso
        run: python3 scripts/sdk_drift.py --report

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: govulncheck (known Go vulnerabilities)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

      - name: Trivy filesystem & config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for API health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time"
          docker compose logs api
          exit 1

      # The script exits non-zero on any failed assertion, but a future edit
      # that no-ops a step would still pass silently — so assert the completion
      # sentinel the script prints only after its last check (the same
      # anti-false-green stance as the ledger and OpenAPI gates).
      - name: Run e2e tests
        run: |
          chmod +x scripts/e2e_test.sh
          out=$(./scripts/e2e_test.sh 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          echo "$out" | grep -q 'E2E_VERIFICATION_COMPLETE' || {
            echo "FATAL: e2e script finished without reaching its final check"; exit 1;
          }

      - name: Dump API logs on failure
        if: failure()
        run: docker compose logs api

      - name: Tear down
        if: always()
        run: docker compose down -v

  build:
    name: Build & Push
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [lint, frontend, test, e2e, security, sdk-drift]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build image (local)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: recurso-scan:${{ github.sha }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: recurso-scan:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
